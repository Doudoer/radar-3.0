# ==============================================================================
# RADAR 3.0 - Plantilla de Configuración de Producción para NGINX
# ==============================================================================
# Ubicación habitual: /etc/nginx/sites-available/radar.conf
# Habilitación: ln -s /etc/nginx/sites-available/radar.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Zona de Rate Limiting por IP para protección contra DoS / Fuerza Bruta
limit_req_zone $binary_remote_addr zone=radar_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=radar_auth_limit:10m rate=5r/s;

# 2. Redirección obligatoria de HTTP (puerto 80) a HTTPS (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name radar-rsy.store www.radar-rsy.store radar-rsy.site www.radar-rsy.site;

    # Permitir renovación de certificados Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Servidor Seguro HTTPS (puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radar-rsy.store www.radar-rsy.store radar-rsy.site www.radar-rsy.site;

    # Certificados SSL (Generados por Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/radar-rsy.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar-rsy.store/privkey.pem;

    # Protocolos y Cifrados Seguros (TLS 1.2 y TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de Seguridad Estrictas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Límite máximo de carga de archivos en peticiones (12 MB para soportar adjuntos de 10 MB)
    client_max_body_size 15M;
    server_tokens off;

    # Bloqueo de rutas de autenticación con rate limiting estricto
    location /api/auth/login {
        limit_req zone=radar_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los adjuntos y respaldos siempre pasan por autenticacion de Node.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Proxy inverso principal hacia la aplicación Node.js
    location / {
        limit_req zone=radar_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Cabeceras de soporte para WebSockets y conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts seguros para operaciones de reportes y respaldos
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
