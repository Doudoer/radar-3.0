    <style>
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes radarPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
    </style>

  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-cyan-500 selection:text-slate-950 transition-colors duration-200">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:#0b1437;color:#a78bfa;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;">
        <div style="position:relative;width:72px;height:72px;margin-bottom:20px;border-radius:24px;background:#1b254b;display:flex;align-items:center;justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="animation:radarSpin 4s linear infinite;">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.35"></circle>
            <path d="M12 2a10 10 0 0 1 10 10"></path>
            <circle cx="12" cy="12" r="6" stroke-opacity="0.55"></circle>
            <path d="M12 6a6 6 0 0 1 6 6"></path>
            <circle cx="12" cy="12" r="2" fill="#a78bfa"></circle>
          </svg>
        </div>
        <div style="font-size:12px;font-weight:600;letter-spacing:0.04em;color:#a3aed0;padding:6px 18px;">
          CARGANDO RADAR V3...
        </div>
